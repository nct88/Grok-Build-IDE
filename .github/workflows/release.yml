name: Release validation

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:grok
      - run: npm --prefix extensions/grok-build-workbench run package:vsix
      - uses: actions/upload-artifact@v6
        with:
          name: grok-build-workbench-vsix
          path: extensions/grok-build-workbench/*.vsix
